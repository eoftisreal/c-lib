name: Tested experimental artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  reproducible-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: python3 -m unittest discover -s verification -p 'test_*.py' -v
      - run: python3 verification/api_contract.py
      - run: python3 verification/feature_status.py --check
      - run: python3 verification/release.py --out "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: c-lib-experimental-linux-x86_64
          path: ${{ runner.temp }}/release/*
